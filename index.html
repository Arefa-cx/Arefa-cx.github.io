<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arefa</title>
<style>
*{
	margin: 0;
	padding: 0;
	box-sizing: border-box;
}
html,body{
	height: 100%;
}
body{
	background-image: url(ima/background.jfif);
	background-repeat: no-repeat;
	background-position: center;
	background-size: cover;
	display: flex;
	flex-direction: column;
	min-height: 100vh;
	padding: 24px 32px;
}
#bg-layer{
	position: fixed;
	inset: 0;
	z-index: -1;
}
#bg-layer img{
	width: 100%;
	height: 100%;
	object-fit: cover;
	object-position: center;
}
.main{
	display: flex;
	justify-content: space-between;
	align-items: center;
	gap: 24px;
	flex-wrap: wrap;
}
.content{
	display: flex;
	flex-direction: column;
	align-items: flex-start;
}
h1{
	font-size: clamp(48px, 12vw, 100px);
	text-align: left;
	margin-top: 8vh;
}
h3{
	font-size: clamp(20px, 4vw, 30px);
	text-align: left;
	margin-top: 10px;
}
p{
	text-align: left;
}
.works{
	margin-top: 24px;
}
.works a{
	display: inline-block;
	margin: 8px 8px 8px 0;
	padding: 10px 24px;
	font-size: clamp(16px, 2.5vw, 20px);
	text-decoration: none;
	color: #333;
	background-color: rgba(255,255,255,0.8);
	border: 1px solid #999;
	border-radius: 8px;
}
.works a:hover{
	background-color: rgba(255,255,255,1);
	border-color: #555;
}
#switch-bg{
	position: fixed;
	left: 20px;
	bottom: 20px;
	padding: 8px 16px;
	font-size: 14px;
	cursor: pointer;
	color: #333;
	background-color: rgba(255,255,255,0.25);
	border: 1px solid rgba(255,255,255,0.4);
	border-radius: 8px;
}
#switch-bg:hover{
	background-color: rgba(255,255,255,0.45);
	border-color: rgba(255,255,255,0.6);
}
.links{
	margin-top: auto;
	align-self: flex-end;
	text-align: right;
	padding-top: 20px;
	font-size: 16px;
}
.links a{
	display: inline-block;
	vertical-align: middle;
	margin-left: 6px;
}
/* 背景为 manosaba1 时：左侧文字与 link：文字用白色 */
body.text-white h1,
body.text-white h3,
body.text-white p{
	color: #fff;
}
/* 背景为 manosaba3 时：link：文字用白色 */
body.link-white .links{
	color: #fff;
}
@media (max-width: 600px){
	body{
		padding: 16px 20px;
	}
	h1{
		margin-top: 4vh;
	}
	.main{
		flex-direction: column;
		align-items: flex-start;
	}
}
</style>
</head>
<body>
<div id="bg-layer" aria-hidden="true"></div>
<div class="main">
    <div class="content">
        <h1>
            <strong>Arefa</strong>
        </h1>
        <h3>
            <i>
                <strong>My Little Works</strong>
            </i>
        </h3>
        <p>这里收藏了一些我制作的小玩意，以后会陆续放上来，欢迎参观。</p>
    </div>
    <p class="works">
        <a href="mahjong/index.html">日麻风盘</a>
    </p>
</div>
<p class="links">link：
    <a href="https://github.com/Arefa-cx/Arefa-cx.github.io">
        <svg height="32" aria-hidden="true" viewBox="0 0 16 16" version="1.1" width="32" data-view-component="true" class="octicon octicon-mark-github">
    <path fill-rule="evenodd" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path>
</svg>
    </a>
</p>
<button id="switch-bg" type="button">换背景</button>
<script>
(function(){
	var names = ['manosaba1', 'manosaba2', 'manosaba3', 'manosaba4'];
	var current = -1;
	var bgLayer = document.getElementById('bg-layer');
	function setBackground(i){
		current = i;
		var img = document.createElement('img');
		img.src = 'ima/' + names[i] + '-1080.jpg';
		img.srcset = 'ima/' + names[i] + '-1080.jpg 1080w, ima/' + names[i] + '-1600.jpg 1600w, ima/' + names[i] + '.png 2048w';
		img.sizes = '100vw';
		img.alt = '';
		img.setAttribute('fetchpriority', 'high');
		bgLayer.innerHTML = '';
		bgLayer.appendChild(img);
		document.body.className = '';
		if (i === 0) {
			document.body.className = 'text-white';
		} else if (i === 2) {
			document.body.className = 'link-white';
		}
	}
	function pickRandom(){
		var i;
		do {
			i = Math.floor(Math.random() * names.length);
		} while (i === current);
		return i;
	}
	setBackground(pickRandom());
	document.getElementById('switch-bg').addEventListener('click', function(){
		setBackground(pickRandom());
	});
})();
</script>
</body>
</html>
